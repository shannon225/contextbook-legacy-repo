name: Release

on:
  push:
    branches: [teapot]
    paths-ignore: ["**/*.md", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        run: |
          version="$(python3 -c "import xml.etree.ElementTree as ET; \
            ns='{http://maven.apache.org/POM/4.0.0}'; \
            print(ET.parse('pom.xml').getroot().find(ns+'version').text)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          case "$version" in
            *-SNAPSHOT)
              echo "::notice::$version is a SNAPSHOT; not releasing."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "::notice::v${version} exists; bump <version> in pom.xml to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "::notice::Releasing v${version}"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build the jar, running the tests
        run: mvn -B -PbuildEncyclopedia -Duser.language=en -Duser.country=US package

      - name: Keep the test reports if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Check and collect the jar
        run: |
          jar="target/encyclopedia-${{ needs.check.outputs.version }}-executable.jar"
          [ -s "$jar" ] || { echo "::error::$jar is missing or empty"; exit 1; }
          count="$(unzip -l "$jar" | grep -cE 'org/bytedeco/(opencv|ffmpeg|leptonica|hdf5)' || true)"
          if [ "$count" != "0" ]; then
            echo "::error::Unused natives are back. Check the deeplearning4j-core exclusions in pom.xml."
            exit 1
          fi
          size_mb=$(( $(stat -c%s "$jar") / 1048576 ))
          echo "Jar: ${size_mb} MB"
          [ "$size_mb" -le 400 ] || { echo "::error::Jar is ${size_mb} MB, expected ~217. Check <javacpp.platform>."; exit 1; }

          mkdir -p dist && cp "$jar" dist/
          (cd dist && sha256sum ./*.jar > SHA256SUMS)

          smoke() {
            want="$1"; shift
            out="$("$@" 2>&1 || true)"
            case "$out" in
              *"$want"*) echo "ok: $*" ;;
              *) echo "::error::'$*' did not print '$want'"; echo "$out" | head -30; exit 1 ;;
            esac
          }
          smoke "library search engine" java -cp "$jar" edu.washington.gs.maccoss.encyclopedia.Encyclopedia -h
          smoke "SearchToLIB"           java -cp "$jar" edu.washington.gs.maccoss.encyclopedia.Encyclopedia -libexport -h
          smoke "ContextMProphetExecutor" java -cp "$jar" edu.washington.gs.maccoss.encyclopedia.context.ContextMProphetExecutor -h

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: EncyclopeDIA ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            dist/encyclopedia-${{ needs.check.outputs.version }}-executable.jar
            dist/SHA256SUMS
          body: |
            Java 17+, Linux x86_64 only. Run it with `-cp` and an explicit main
            class.
